<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="510" viewBox="0 0 1600 510">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4e5962"/>
    </marker>

  </defs>
  <style>
    .stage{font:700 17px Arial,sans-serif;letter-spacing:1.5px;fill:#8b4e45}
    .title{font:700 25px Arial,sans-serif;fill:#1f272d}
    .copy{font:400 18px Arial,sans-serif;fill:#4f5960}
    .metric{font:700 21px Arial,sans-serif;fill:#26313a}
    .sub{font:400 15px Arial,sans-serif;fill:#67727a}
    .arrowlabel{font:700 15px Arial,sans-serif;fill:#4e5962}
    .group{font:700 14px Arial,sans-serif;letter-spacing:1.4px;fill:#4e5962}
  </style>
  <rect width="1600" height="510" fill="#f6f3ec"/>

  <g fill="none" stroke="#7c858b" stroke-width="1.5">
    <path d="M345 50 V42 H925 V50"/>
    <path d="M965 50 V42 H1565 V50"/>
  </g>
  <text x="635" y="30" text-anchor="middle" class="group">ORDER-ONLY LINK</text>
  <text x="1265" y="30" text-anchor="middle" class="group">MEDIATED WRITEBACK LINK</text>

  <g fill="#26313a" opacity="0.07">
    <rect x="37" y="70" width="270" height="330" rx="18"/>
    <rect x="347" y="70" width="270" height="330" rx="18"/>
    <rect x="657" y="70" width="270" height="330" rx="18"/>
    <rect x="967" y="70" width="270" height="330" rx="18"/>
    <rect x="1277" y="70" width="290" height="330" rx="18"/>
  </g>

  <g>
    <rect x="35" y="65" width="270" height="330" rx="18" fill="#e9e3d8" stroke="#b8ada1"/>
    <rect x="345" y="65" width="270" height="330" rx="18" fill="#e1e7e6" stroke="#a7b5b5"/>
    <rect x="655" y="65" width="270" height="330" rx="18" fill="#eee1dc" stroke="#c5a69c"/>
    <rect x="965" y="65" width="270" height="330" rx="18" fill="#e1e7e6" stroke="#a7b5b5"/>
    <rect x="1275" y="65" width="290" height="330" rx="18" fill="#eee1dc" stroke="#c5a69c"/>
  </g>

  <text x="60" y="105" class="stage">1 / ACTIVATE</text>
  <text x="60" y="145" class="title">Task evidence</text>
  <text x="60" y="179" class="copy">Immediate writeback or</text>
  <text x="60" y="205" class="copy">hold until outcome</text>
  <text x="60" y="274" class="metric">Top-10 displacement</text>
  <text x="60" y="306" class="metric">0.765 [0.745, 0.785]</text>
  <text x="60" y="352" class="sub">Inert log = no-state baseline</text>

  <text x="370" y="105" class="stage">2 / SERVE</text>
  <text x="370" y="145" class="title">Learned shelf</text>
  <text x="370" y="179" class="copy">Same candidate IDs</text>
  <text x="370" y="205" class="copy">and attributes</text>
  <text x="370" y="274" class="metric">SASRec + GRU4Rec</text>
  <text x="370" y="306" class="metric">920 task-model units</text>
  <text x="370" y="352" class="sub">Four Amazon review categories</text>

  <text x="680" y="105" class="stage">3 / ACT</text>
  <text x="680" y="145" class="title">Model selection</text>
  <text x="680" y="179" class="copy">Two repeated calls</text>
  <text x="680" y="205" class="copy">per condition</text>
  <text x="680" y="264" class="metric">DeepSeek 0.193</text>
  <text x="680" y="296" class="metric">MiMo 0.147</text>
  <text x="680" y="342" class="sub">Masked controls near zero</text>

  <text x="990" y="105" class="stage">4 / WRITE BACK</text>
  <text x="990" y="145" class="title">Later shelf</text>
  <text x="990" y="179" class="copy">Selected item enters the</text>
  <text x="990" y="205" class="copy">same frozen recommender</text>
  <text x="990" y="264" class="metric">DeepSeek-source 0.035</text>
  <text x="990" y="296" class="metric">MiMo-source 0.025</text>
  <text x="990" y="342" class="sub">7.5% changed next shelf</text>

  <text x="1300" y="105" class="stage">5 / ACT AGAIN</text>
  <text x="1300" y="145" class="title">Later model selection</text>
  <text x="1300" y="179" class="copy">Held-out next-task proxy</text>
  <text x="1300" y="205" class="copy">served to both LLMs</text>
  <text x="1300" y="264" class="metric">DeepSeek 0.035</text>
  <text x="1300" y="296" class="metric">MiMo 0.017</text>
  <text x="1300" y="342" class="sub">Matched changes: 1.8% / 1.3%</text>

  <g stroke="#4e5962" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M305 230 L338 230"/>
    <path d="M615 230 L648 230"/>
    <path d="M925 230 L958 230"/>
    <path d="M1235 230 L1268 230"/>
  </g>
  <text x="800" y="454" text-anchor="middle" class="arrowlabel">CONTROLLED ONE-STEP MODEL-SYSTEM PATH</text>
  <text x="800" y="482" text-anchor="middle" class="sub">Measured in a research storefront; not a claim about people, production retailers, or long-run amplification.</text>
</svg>
