<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59666e"/>
    </marker>
  </defs>
  <style>
    .kicker{font:700 16px Arial,sans-serif;letter-spacing:1.5px;fill:#9a554a}
    .title{font:700 29px Arial,sans-serif;fill:#1f272d}
    .label{font:700 17px Arial,sans-serif;fill:#39454d}
    .value{font:400 18px Arial,sans-serif;fill:#59666e}
    .status{font:700 20px Arial,sans-serif;fill:#273940}
    .small{font:400 15px Arial,sans-serif;fill:#6a7379}
  </style>
  <rect width="1200" height="650" fill="#f6f3ec"/>
  <rect x="35" y="35" width="1130" height="580" rx="22" fill="#ebe6dc" stroke="#b8ada1" stroke-width="2"/>
  <text x="75" y="85" class="kicker">OUTCOME-GATED WRITEBACK RECEIPT</text>
  <text x="75" y="130" class="title">Keep task help separate from platform evidence.</text>

  <rect x="75" y="175" width="315" height="315" rx="16" fill="#f7f4ed" stroke="#c9c0b5"/>
  <text x="105" y="215" class="label">ACTION SOURCE</text>
  <text x="105" y="254" class="status">AI shopping agent</text>
  <text x="105" y="300" class="label">TASK STATUS</text>
  <text x="105" y="339" class="status">Pending</text>
  <text x="105" y="385" class="label">CURRENT EVENT</text>
  <text x="105" y="424" class="value">Viewed candidate q17</text>
  <text x="105" y="456" class="small">The action is visible and attributable.</text>

  <rect x="445" y="175" width="315" height="315" rx="16" fill="#dfe7e5" stroke="#9eafac"/>
  <text x="475" y="215" class="label">TASK-LOCAL CHANNEL</text>
  <text x="475" y="254" class="status">Active now</text>
  <text x="475" y="300" class="value">May improve the current shelf</text>
  <text x="475" y="332" class="value">without changing the principal</text>
  <text x="475" y="364" class="value">profile.</text>
  <rect x="475" y="413" width="245" height="46" rx="23" fill="#263940"/>
  <text x="598" y="443" text-anchor="middle" style="font:700 16px Arial,sans-serif;fill:#f6f3ec">AVAILABLE DURING TASK</text>

  <rect x="815" y="175" width="315" height="315" rx="16" fill="#edddd8" stroke="#c8a79e"/>
  <text x="845" y="215" class="label">PLATFORM PROFILE</text>
  <text x="845" y="254" class="status">Waiting for outcome</text>
  <text x="845" y="300" class="value">Success: offer commit</text>
  <text x="845" y="332" class="value">Failure: offer discard</text>
  <text x="845" y="364" class="value">Pending: do not admit</text>
  <rect x="845" y="413" width="245" height="46" rx="23" fill="#9a554a"/>
  <text x="968" y="443" text-anchor="middle" style="font:700 16px Arial,sans-serif;fill:#fffaf2">HELD, NOT DELETED</text>

  <g stroke="#59666e" stroke-width="3" fill="none" marker-end="url(#arrow2)">
    <path d="M390 334 L438 334"/>
    <path d="M760 334 L808 334"/>
  </g>
  <text x="600" y="553" text-anchor="middle" class="small">Unevaluated design response: the experiments establish model-system effects, not that people understand or prefer this control.</text>
</svg>
